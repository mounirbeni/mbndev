name: Capture portfolio screenshots

# Refreshes the full-size project captures used by the home page gallery.
# Run it from the Actions tab whenever a client site changes.
on:
  workflow_dispatch:
  push:
    branches: [claude/mbn-dev-brand-guide-uw45fi]
    paths:
      - .github/workflows/capture-portfolio.yml
      - frontend/scripts/capture-portfolio.mjs

permissions:
  contents: write

concurrency:
  group: capture-portfolio-${{ github.ref }}
  cancel-in-progress: true

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install capture tools
        run: |
          mkdir -p /tmp/capture && cd /tmp/capture
          npm init -y >/dev/null
          npm i playwright@1.56.1 sharp@0.34
          npx playwright install --with-deps chromium
      - name: Capture
        # Run from /tmp/capture so imports resolve there; the script writes
        # into the current directory (frontend/).
        run: |
          cp scripts/capture-portfolio.mjs /tmp/capture/
          node /tmp/capture/capture-portfolio.mjs
      - name: Commit captures
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add public/images/portfolio/hd
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "Refresh portfolio captures"
          git push
