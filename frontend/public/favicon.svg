<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 36 36">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#8b5cf6"/>
      <stop offset="55%"  stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#6d28d9"/>
    </linearGradient>
    <linearGradient id="shine" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="white" stop-opacity="0.14"/>
      <stop offset="52%"  stop-color="white" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="36" height="36" rx="10" fill="url(#bg)"/>

  <!-- Gloss shine -->
  <rect width="36" height="36" rx="10" fill="url(#shine)"/>

  <!-- < left bracket -->
  <path d="M12.5 9L7 18L12.5 27"
