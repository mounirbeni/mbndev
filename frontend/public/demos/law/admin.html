<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>ALAOUI — Owner dashboard · Demo</title>
<meta name="robots" content="noindex, nofollow" />
<meta name="theme-color" content="#0f2a24" />
<link rel="icon" href="/demos/law/icon.svg" type="image/svg+xml" />
<link rel="preload" href="/demos/law/fonts/playfair-display-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin />
<link rel="stylesheet" href="/demos/law/css/fonts.css" />
<link rel="stylesheet" href="/demos/law/css/admin.css" />
</head>
<body>
<!-- PIN gate (demo) -->
<div class="gate" id="gate">
  <form class="gate-card" id="gateForm">
    <div class="g-brand"><svg viewBox="0 0 48 48" aria-hidden="true"><circle cx="24" cy="24" r="24" fill="#0f2a24"/><circle cx="24" cy="24" r="21.2" fill="none" stroke="#c2a15b" stroke-width="1.1"/><circle cx="24" cy="24" r="19.4" fill="none" stroke="#c2a15b" stroke-width=".5" opacity=".65"/><path d="M15 34.5 24 13l9 21.5" fill="none" stroke="#e8d3a2" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"/><path d="M10 21.5h28" stroke="#e8d3a2" stroke-width="1.7" stroke-linecap="round"/><path d="M11.5 21.5 8.6 28.2h5.8zM36.5 21.5l-2.9 6.7h5.8z" fill="none" stroke="#c2a15b" stroke-width="1" stroke-linejoin="round"/><path d="M8 28.4a3.4 2.6 0 0 0 6.2 0M33.8 28.4a3.4 2.6 0 0 0 6.2 0" fill="none" stroke="#c2a15b" stroke-width="1" stroke-linecap="round"/><circle cx="24" cy="10.6" r="1.5" fill="#c2a15b"/></svg><b>ALAOUI</b><span data-a="owner">Owner dashboard</span></div>
    <label for="pin" data-a="pinLabel">Enter your PIN</label>
    <input id="pin" inputmode="numeric" autocomplete="one-time-code" maxlength="8" pattern="[0-9]*" />
    <p class="g-hint" id="pinHint" hidden></p>
    <p class="g-err" id="pinErr" role="alert"></p>
    <button class="abtn pri" type="submit" data-a="unlock">Unlock</button>
    <a class="g-back" href="/demo/law"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></svg><span data-a="backSite">Back to the website</span></a>
  </form>
  <div class="gate-card gate-off" id="gateOff" hidden role="alert">
    <div class="g-brand"><svg viewBox="0 0 48 48" aria-hidden="true"><circle cx="24" cy="24" r="24" fill="#0f2a24"/><circle cx="24" cy="24" r="21.2" fill="none" stroke="#c2a15b" stroke-width="1.1"/><circle cx="24" cy="24" r="19.4" fill="none" stroke="#c2a15b" stroke-width=".5" opacity=".65"/><path d="M15 34.5 24 13l9 21.5" fill="none" stroke="#e8d3a2" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"/><path d="M10 21.5h28" stroke="#e8d3a2" stroke-width="1.7" stroke-linecap="round"/><path d="M11.5 21.5 8.6 28.2h5.8zM36.5 21.5l-2.9 6.7h5.8z" fill="none" stroke="#c2a15b" stroke-width="1" stroke-linejoin="round"/><path d="M8 28.4a3.4 2.6 0 0 0 6.2 0M33.8 28.4a3.4 2.6 0 0 0 6.2 0" fill="none" stroke="#c2a15b" stroke-width="1" stroke-linecap="round"/><circle cx="24" cy="10.6" r="1.5" fill="#c2a15b"/></svg><b>ALAOUI</b></div>
    <h1 id="offTitle"></h1>
    <p id="offBody"></p>
  </div>
</div>

<div class="app" id="app" hidden>
  <aside class="side">
    <div class="s-brand"><svg viewBox="0 0 48 48" aria-hidden="true"><circle cx="24" cy="24" r="24" fill="#0f2a24"/><circle cx="24" cy="24" r="21.2" fill="none" stroke="#c2a15b" stroke-width="1.1"/><circle cx="24" cy="24" r="19.4" fill="none" stroke="#c2a15b" stroke-width=".5" opacity=".65"/><path d="M15 34.5 24 13l9 21.5" fill="none" stroke="#e8d3a2" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"/><path d="M10 21.5h28" stroke="#e8d3a2" stroke-width="1.7" stroke-linecap="round"/><path d="M11.5 21.5 8.6 28.2h5.8zM36.5 21.5l-2.9 6.7h5.8z" fill="none" stroke="#c2a15b" stroke-width="1" stroke-linejoin="round"/><path d="M8 28.4a3.4 2.6 0 0 0 6.2 0M33.8 28.4a3.4 2.6 0 0 0 6.2 0" fill="none" stroke="#c2a15b" stroke-width="1" stroke-linecap="round"/><circle cx="24" cy="10.6" r="1.5" fill="#c2a15b"/></svg><div><b>ALAOUI</b><small data-a="owner">Owner dashboard</small></div></div>
    <nav class="tabs" id="tabs" aria-label="Dashboard"></nav>
    <div class="s-foot">
      <div id="alang"></div>
      <a href="/demo/law/secretary"><span data-a="toDesk">Secretary desk</span><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 17 17 7"/><path d="M7 7h10v10"/></svg></a>
      <a href="/demo/law" target="_blank" rel="noopener"><span data-a="viewSite">View website</span><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 17 17 7"/><path d="M7 7h10v10"/></svg></a>
      <span class="demo-tag" data-a="demoTag">Demo by MBN DEV</span>
    </div>
  </aside>
  <main class="main">
    <header class="top">
      <div><h1 id="pageTitle"></h1><p id="pageSub"></p></div>
      <div class="top-r"><div class="only-small" id="alang2"></div><span class="live" id="liveState"></span><button class="abtn ghost sm" id="soundBtn"></button></div>
    </header>
    <section id="view"></section>
  </main>
</div>
<div class="amodal" id="amodal" role="dialog" aria-modal="true" hidden></div>
<div class="atoast" id="atoast" role="status" aria-live="polite"></div>
<script type="module" src="/demos/law/js/admin.js"></script>
</body>
</html>
