<!doctype html>
<html lang="en" dir="ltr" data-role="secretary">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>ALAOUI — Secretary desk · Demo</title>
<meta name="robots" content="noindex, nofollow" />
<meta name="theme-color" content="#17294a" />
<link rel="icon" href="/demos/law/icon.svg" type="image/svg+xml" />
<link rel="preload" href="/demos/law/fonts/cormorant-garamond-latin-700-normal.woff2" as="font" type="font/woff2" crossorigin />
<link rel="stylesheet" href="/demos/law/css/fonts.css" />
<link rel="stylesheet" href="/demos/law/css/admin.css" />
</head>
<body>
<!-- PIN gate (demo) -->
<div class="gate" id="gate">
  <form class="gate-card" id="gateForm">
    <div class="g-brand"><svg viewBox="0 0 40 40" aria-hidden="true"><rect width="40" height="40" rx="9" fill="#17294a"/><path d="M9 29h22M12 29V17m5 12V17m6 12V17m5 12V17M8 17l12-8 12 8Z" fill="none" stroke="#e8d3a2" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg><b>ALAOUI</b><span data-a="deskRole">Secretary desk</span></div>
    <label for="pin" data-a="pinLabel">Enter your PIN</label>
    <input id="pin" inputmode="numeric" autocomplete="one-time-code" maxlength="8" pattern="[0-9]*" />
    <p class="g-hint" id="pinHint" hidden></p>
    <p class="g-err" id="pinErr" role="alert"></p>
    <button class="abtn pri" type="submit" data-a="unlock">Unlock</button>
    <a class="g-back" href="/demo/law"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></svg><span data-a="backSite">Back to the website</span></a>
  </form>
  <div class="gate-card gate-off" id="gateOff" hidden role="alert">
    <div class="g-brand"><svg viewBox="0 0 40 40" aria-hidden="true"><rect width="40" height="40" rx="9" fill="#17294a"/><path d="M9 29h22M12 29V17m5 12V17m6 12V17m5 12V17M8 17l12-8 12 8Z" fill="none" stroke="#e8d3a2" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg><b>ALAOUI</b></div>
    <h1 id="offTitle"></h1>
    <p id="offBody"></p>
  </div>
</div>

<div class="app" id="app" hidden>
  <aside class="side">
    <div class="s-brand"><svg viewBox="0 0 40 40" aria-hidden="true"><rect width="40" height="40" rx="9" fill="#17294a"/><path d="M9 29h22M12 29V17m5 12V17m6 12V17m5 12V17M8 17l12-8 12 8Z" fill="none" stroke="#e8d3a2" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg><div><b>ALAOUI</b><small data-a="deskRole">Secretary desk</small></div></div>
    <nav class="tabs" id="tabs" aria-label="Dashboard"></nav>
    <div class="s-foot">
      <div id="alang"></div>
      <a href="/demo/law/admin"><span data-a="owner">Owner dashboard</span><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 17 17 7"/><path d="M7 7h10v10"/></svg></a>
      <a href="/demo/law" target="_blank" rel="noopener"><span data-a="viewSite">View website</span><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 17 17 7"/><path d="M7 7h10v10"/></svg></a>
      <span class="demo-tag" data-a="demoTag">Demo by MBN DEV</span>
    </div>
  </aside>
  <main class="main">
    <header class="top">
      <div><h1 id="pageTitle"></h1><p id="pageSub"></p></div>
      <div class="top-r"><div class="only-small" id="alang2"></div><span class="live" id="liveState"></span><button class="abtn ghost sm" id="soundBtn"></button></div>
    </header>
    <section id="view"></section>
  </main>
</div>
<div class="amodal" id="amodal" role="dialog" aria-modal="true" hidden></div>
<div class="atoast" id="atoast" role="status" aria-live="polite"></div>
<script type="module" src="/demos/law/js/admin.js"></script>
</body>
</html>
