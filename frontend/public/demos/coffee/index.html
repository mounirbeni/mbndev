<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>NOUR Coffee Atelier — Specialty coffee in Maârif, Casablanca · Demo</title>
<meta name="description" content="Order ahead, find your bean, collect stamps and book workshops. A demo coffee-shop website by MBN DEV." />
<meta name="robots" content="noindex, nofollow" />
<meta name="theme-color" content="#f5efe6" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="NOUR" />
<link rel="icon" href="/demos/coffee/icon.svg" type="image/svg+xml" />
<link rel="manifest" href="/demos/coffee/manifest.webmanifest" />
<meta property="og:title" content="NOUR Coffee Atelier — demo by MBN DEV" />
<meta property="og:description" content="A coffee-shop website with order-ahead, live order tracking, a flavour-matched bean shop, stamp card, gift cards and workshop bookings." />
<link rel="preload" href="/demos/coffee/img/hero.webp" as="image" />
<link rel="preload" href="/demos/coffee/fonts/fraunces-latin-full-normal.woff2" as="font" type="font/woff2" crossorigin />
<link rel="preload" href="/demos/coffee/fonts/bricolage-grotesque-latin-standard-normal.woff2" as="font" type="font/woff2" crossorigin />
<link rel="stylesheet" href="/demos/coffee/css/fonts.css" />
<link rel="stylesheet" href="/demos/coffee/css/site.css" />
</head>
<body>
<a class="skip" href="#order">Skip to the menu</a>

<!-- Demo notice (MBN DEV) -->
<div class="demobar" id="demobar">
  <span class="dot"></span><span data-t="demoBar"></span>
  <a href="https://mbndev.ma/contact" target="_blank" rel="noopener" data-t="demoCta"></a>
  <button class="x" id="demobarClose" aria-label="Close">×</button>
</div>
<div class="announce" id="announce" hidden><span id="announceText"></span></div>

<header class="nav" id="nav">
  <a class="brand" href="#top" aria-label="NOUR Coffee Atelier">
    <svg viewBox="0 0 40 40" aria-hidden="true"><circle cx="20" cy="20" r="18" fill="var(--sun)"/><path d="M11 25c3-9 15-9 18 0" fill="none" stroke="var(--ink)" stroke-width="3" stroke-linecap="round"/><circle cx="20" cy="15" r="3.2" fill="var(--ink)"/></svg>
    <span>NOUR<small>coffee atelier</small></span>
  </a>
  <nav class="links" aria-label="Sections">
    <a href="#order" data-t="nav_order"></a><a href="#beans" data-t="nav_beans"></a><a href="#brew" data-t="nav_brew"></a>
    <a href="#card" data-t="nav_loyalty"></a><a href="#gifts" data-t="nav_gifts"></a><a href="#events" data-t="nav_events"></a><a href="#visit" data-t="nav_visit"></a>
  </nav>
  <div class="nav-end">
    <span class="status" id="navStatus"></span>
    <div class="langs" id="langs" role="group" aria-label="Language"></div>
    <button class="bagbtn" id="bagBtn" aria-label="Bag"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 8h12l-1 12H7L6 8Z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><path d="M9 8V6a3 3 0 0 1 6 0v2" fill="none" stroke="currentColor" stroke-width="2"/></svg><b id="bagCount">0</b></button>
  </div>
</header>

<main id="top">
  <!-- HERO -->
  <section class="hero">
    <div class="hero-copy">
      <p class="kicker" data-t="heroKicker"></p>
      <h1 class="display"><span class="l1" data-t="heroL1"></span> <span class="l2" data-t="heroL2"></span> <em class="l3" data-t="heroL3"></em></h1>
      <p class="lead" data-t="heroSub"></p>
      <div class="cta-row">
        <a class="btn sun" href="#order"><span data-t="heroCta1"></span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14m-6-6 6 6-6 6" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg></a>
        <a class="btn ghost" href="#beans" data-t="heroCta2"></a>
      </div>
      <div class="live-chips">
        <span class="chip" id="chipOpen"></span>
        <span class="chip" id="chipWait"></span>
        <span class="chip bean" id="chipBean"></span>
      </div>
    </div>
    <div class="hero-art" aria-hidden="true">
      <div class="hero-photo"><img src="/demos/coffee/img/hero.webp" alt="" width="1400" height="788" fetchpriority="high" decoding="async" /></div>
      <div class="hero-badge">
        <div class="sun-disc"></div>
        <svg class="ring" viewBox="0 0 400 400"><defs><path id="circ" d="M200 200 m-170 0 a170 170 0 1 1 340 0 a170 170 0 1 1 -340 0"/></defs>
          <text><textPath href="#circ">SPECIALTY COFFEE ✺ ROASTED IN CASABLANCA ✺ ORDER AHEAD ✺ SINCE TODAY ✺ </textPath></text></svg>
        <div class="hero-glass" id="heroGlass"></div>
      </div>
      <div class="hero-label" id="heroLabel"></div>
    </div>
  </section>

  <div class="marquee" aria-hidden="true"><div class="track" id="marquee"></div></div>

  <!-- ORDER -->
  <section class="section" id="order">
    <div class="sec-head">
      <p class="kicker" data-t="orderK"></p>
      <h2 class="display" data-t="orderT"></h2>
      <p class="lead" data-t="orderS"></p>
    </div>
    <div class="paused" id="pausedNote" hidden data-t="paused"></div>
    <div class="menu-tools">
      <label class="search"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="2"/><path d="m20 20-4-4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg><input id="q" type="search" data-t-ph="search" autocomplete="off" /></label>
      <button class="filterbtn" id="filterBtn" type="button" aria-label="Filters"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h4M12 17h8" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><circle cx="16" cy="7" r="2.2" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="10" cy="17" r="2.2" fill="none" stroke="currentColor" stroke-width="2"/></svg><b id="filterDot" hidden></b></button>
      <div class="filters" id="filters" role="group"></div>
    </div>
    <div class="menu-wrap">
      <nav class="cats" id="cats" aria-label="Categories"></nav>
      <div class="menu-list" id="menuList"></div>
    </div>
  </section>

  <!-- BEANS -->
  <section class="section beans-sec" id="beans">
    <div class="sec-head">
      <p class="kicker" data-t="beansK"></p>
      <h2 class="display" data-t="beansT"></h2>
      <p class="lead" data-t="beansS"></p>
    </div>
    <div class="compass-grid">
      <div class="compass" id="compass">
        <span class="ax top" data-t="delicate"></span><span class="ax bottom" data-t="bold"></span>
        <span class="ax left" data-t="fruity"></span><span class="ax right" data-t="chocolatey"></span>
        <div class="pad" id="pad"><div class="cross"></div><div id="beanDots"></div><button class="knob" id="knob" aria-label="Taste"></button></div>
      </div>
      <div class="match" id="match"></div>
    </div>
    <div class="bean-row" id="beanRow"></div>
  </section>

  <!-- BREW GUIDE -->
  <section class="section dark" id="brew">
    <div class="sec-head">
      <p class="kicker" data-t="brewK"></p>
      <h2 class="display" data-t="brewT"></h2>
      <p class="lead" data-t="brewS"></p>
    </div>
    <div class="brew-grid">
      <div class="brew-ctl">
        <div class="seg" id="brewMethods" role="group"></div>
        <div class="cups"><span data-t="cups"></span><div class="stepper"><button id="cupMinus" aria-label="−">−</button><output id="cupN">2</output><button id="cupPlus" aria-label="+">+</button></div></div>
        <dl class="brew-out" id="brewOut"></dl>
      </div>
      <div class="brew-timer">
        <svg viewBox="0 0 200 200" class="dial"><circle cx="100" cy="100" r="88" class="track"/><circle cx="100" cy="100" r="88" class="prog" id="brewProg"/></svg>
        <div class="dial-in"><output id="brewClock">0:00</output><span id="brewStep"></span></div>
        <div class="timer-btns"><button class="btn sun sm" id="brewStart" data-t="start"></button><button class="btn ghost sm light" id="brewReset" data-t="reset"></button></div>
        <ol class="steps" id="brewSteps"></ol>
      </div>
    </div>
  </section>

  <!-- LOYALTY -->
  <section class="section" id="card">
    <div class="loy-grid">
      <div>
        <p class="kicker" data-t="loyK"></p>
        <h2 class="display" data-t="loyT"></h2>
        <p class="lead" data-t="loyS"></p>
        <ol class="how"><li data-t="how1"></li><li data-t="how2"></li><li data-t="how3"></li></ol>
        <form class="loy-form" id="loyForm">
          <label class="field"><span data-t="phoneLabel"></span><input id="loyPhone" type="tel" inputmode="tel" placeholder="06 12 34 56 78" autocomplete="tel" /></label>
          <div class="row"><button class="btn ink" type="submit" data-t="showCard"></button><button class="btn ghost" type="button" id="loyJoin" data-t="join"></button></div>
          <p class="hint" data-t="loyDemo"></p>
          <p class="msg" id="loyMsg" role="status"></p>
        </form>
      </div>
      <div class="stampcard-wrap"><div class="stampcard" id="stampcard"></div></div>
    </div>
  </section>

  <!-- GIFT CARDS -->
  <section class="section gifts-sec" id="gifts">
    <div class="sec-head">
      <p class="kicker" data-t="giftK"></p>
      <h2 class="display" data-t="giftT"></h2>
      <p class="lead" data-t="giftS"></p>
    </div>
    <div class="gift-grid">
      <form class="gift-form" id="giftForm">
        <fieldset><legend data-t="amount"></legend><div class="pills" id="giftAmounts"></div></fieldset>
        <fieldset><legend data-t="design"></legend><div class="pills" id="giftDesigns"></div></fieldset>
        <div class="two"><label class="field"><span data-t="to"></span><input id="giftTo" maxlength="30" /></label><label class="field"><span data-t="from"></span><input id="giftFrom" maxlength="30" /></label></div>
        <label class="field"><span data-t="message"></span><textarea id="giftMsg" rows="2" maxlength="140" data-t-ph="messagePh"></textarea></label>
        <button class="btn sun wide" type="submit" id="giftBuy"></button>
        <p class="msg" id="giftMsgOut" role="status"></p>
      </form>
      <div class="gift-preview"><div class="giftcard" id="giftCard"></div></div>
    </div>
  </section>

  <!-- EVENTS -->
  <section class="section" id="events">
    <div class="sec-head">
      <p class="kicker" data-t="evK"></p>
      <h2 class="display" data-t="evT"></h2>
      <p class="lead" data-t="evS"></p>
    </div>
    <div class="events" id="eventList"></div>
    <div class="catering">
      <div><h3 class="display sm" data-t="catT"></h3><p class="lead" data-t="catS"></p></div>
      <form id="quoteForm" class="quote">
        <div class="two"><label class="field"><span data-t="company"></span><input id="qCompany" maxlength="60" /></label><label class="field"><span data-t="people"></span><input id="qPeople" type="number" min="5" max="2000" value="30" /></label></div>
        <div class="two"><label class="field"><span data-t="date"></span><input id="qDate" type="date" /></label><label class="field"><span data-t="type"></span><select id="qType"></select></label></div>
        <div class="two"><label class="field"><span data-t="name"></span><input id="qName" maxlength="60" autocomplete="name" /></label><label class="field"><span data-t="phone"></span><input id="qPhone" type="tel" autocomplete="tel" /></label></div>
        <button class="btn ink wide" type="submit" data-t="sendQuote"></button>
        <p class="msg" id="quoteMsg" role="status"></p>
      </form>
    </div>
  </section>

  <!-- VISIT -->
  <section class="section visit" id="visit">
    <div class="visit-grid">
      <div>
        <p class="kicker" data-t="visitK"></p>
        <h2 class="display" data-t="visitT"></h2>
        <p class="addr" id="addr"></p>
        <div class="row act">
          <a class="btn ink" id="dirBtn" target="_blank" rel="noopener" data-t="directions"></a>
          <button class="btn ghost" data-demo="call" data-t="call"></button>
          <button class="btn ghost" data-demo="whatsapp" data-t="whatsapp"></button>
        </div>
        <h3 class="mini" data-t="hours"></h3>
        <table class="hours" id="hoursTable"></table>
      </div>
      <div>
        <div class="map" id="map" aria-hidden="true"></div>
        <h3 class="mini" data-t="amenities"></h3>
        <ul class="amen" id="amen"></ul>
      </div>
    </div>
  </section>
</main>

<footer class="foot">
  <form class="news" id="newsForm">
    <div><h3 class="display sm" data-t="newsT"></h3><p data-t="newsS"></p></div>
    <div class="news-in"><input id="newsEmail" type="email" required data-t-ph="email" autocomplete="email" /><button class="btn sun" type="submit" data-t="subscribe"></button></div>
    <p class="msg" id="newsMsg" role="status"></p>
  </form>
  <div class="foot-bottom">
    <div class="brand big">NOUR<small>coffee atelier</small></div>
    <p class="demo-note"><span data-t="footDemo"></span> <a href="https://mbndev.ma" target="_blank" rel="noopener" data-t="footCta"></a></p>
    <a class="owner" href="/demo/coffee/admin" data-t="ownerLink"></a>
  </div>
</footer>

<!-- Mobile bottom bar -->
<nav class="tabbar" aria-label="Quick">
  <a href="#order" data-tabbar="order"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4h7v7H4zM13 4h7v7h-7zM4 13h7v7H4z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><circle cx="16.5" cy="16.5" r="3" fill="none" stroke="currentColor" stroke-width="2"/><path d="m19 19 2 2" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg><span data-t="discover"></span></a>
  <button type="button" id="favTab" data-tabbar="favs"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10Z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg><span data-t="favs"></span></button>
  <a href="#card" data-tabbar="card"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="6" width="18" height="12" rx="3" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="8" cy="12" r="1.6" fill="currentColor"/><circle cx="12" cy="12" r="1.6" fill="currentColor"/><circle cx="16" cy="12" r="1.6" fill="none" stroke="currentColor" stroke-width="1.4"/></svg><span data-t="nav_loyalty"></span></a>
  <a href="#visit" data-tabbar="visit"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 4-5 2v14l5-2 6 2 5-2V4l-5 2-6-2Z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><path d="M9 4v14M15 6v14" fill="none" stroke="currentColor" stroke-width="2"/></svg><span data-t="nav_visit"></span></a>
  <button type="button" id="bagBtn2" data-tabbar="bag"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 8h12l-1 12H7L6 8Z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><path d="M9 8V6a3 3 0 0 1 6 0v2" fill="none" stroke="currentColor" stroke-width="2"/></svg><span data-t="cart"></span><b id="bagCount2">0</b></button>
</nav>

<!-- Live order pill -->
<button class="livepill" id="livePill" hidden></button>

<!-- Overlays -->
<div class="scrim" id="scrim" hidden></div>
<aside class="sheet drawer" id="bag" role="dialog" aria-modal="true" aria-labelledby="bagTitle" hidden></aside>
<div class="sheet modal" id="builder" role="dialog" aria-modal="true" hidden></div>
<div class="sheet modal" id="tracker" role="dialog" aria-modal="true" hidden></div>
<div class="sheet modal small" id="bookSheet" role="dialog" aria-modal="true" hidden></div>
<div class="sheet modal small" id="filterSheet" role="dialog" aria-modal="true" hidden></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script type="module" src="/demos/coffee/js/site.js"></script>
</body>
</html>
