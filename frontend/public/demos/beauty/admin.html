<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>LALLA — Owner dashboard · Demo</title>
<meta name="robots" content="noindex, nofollow" />
<meta name="theme-color" content="#3b1d2e" />
<link rel="icon" href="/demos/beauty/icon.svg" type="image/svg+xml" />
<link rel="preload" href="/demos/beauty/fonts/manrope-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin />
<link rel="stylesheet" href="/demos/beauty/css/fonts.css" />
<link rel="stylesheet" href="/demos/beauty/css/admin.css" />
</head>
<body>
<!-- PIN gate (demo) -->
<div class="gate" id="gate">
  <form class="gate-card" id="gateForm">
    <div class="g-brand"><svg viewBox="0 0 64 64" aria-hidden="true"><rect width="64" height="64" rx="16" fill="#fbf3ee"/><circle cx="32" cy="32" r="24" fill="#b0516f"/><g fill="#fff6f2"><ellipse cx="32" cy="18" rx="6" ry="11"/><ellipse cx="32" cy="18" rx="6" ry="11" transform="rotate(72 32 32)"/><ellipse cx="32" cy="18" rx="6" ry="11" transform="rotate(144 32 32)"/><ellipse cx="32" cy="18" rx="6" ry="11" transform="rotate(216 32 32)"/><ellipse cx="32" cy="18" rx="6" ry="11" transform="rotate(288 32 32)"/></g><circle cx="32" cy="32" r="6" fill="#b88a44"/></svg><b>LALLA</b><span data-a="owner">Owner dashboard</span></div>
    <label for="pin" data-a="pinLabel">Enter your PIN</label>
    <input id="pin" inputmode="numeric" autocomplete="one-time-code" maxlength="8" pattern="[0-9]*" />
    <p class="g-hint" id="pinHint" hidden></p>
    <p class="g-err" id="pinErr" role="alert"></p>
    <button class="abtn rose" type="submit" data-a="unlock">Unlock</button>
    <a class="g-back" href="/demo/beauty"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></svg><span data-a="backSite">Back to the website</span></a>
  </form>
  <div class="gate-card gate-off" id="gateOff" hidden role="alert">
    <div class="g-brand"><svg viewBox="0 0 64 64" aria-hidden="true"><rect width="64" height="64" rx="16" fill="#fbf3ee"/><circle cx="32" cy="32" r="24" fill="#b0516f"/><g fill="#fff6f2"><ellipse cx="32" cy="18" rx="6" ry="11"/><ellipse cx="32" cy="18" rx="6" ry="11" transform="rotate(72 32 32)"/><ellipse cx="32" cy="18" rx="6" ry="11" transform="rotate(144 32 32)"/><ellipse cx="32" cy="18" rx="6" ry="11" transform="rotate(216 32 32)"/><ellipse cx="32" cy="18" rx="6" ry="11" transform="rotate(288 32 32)"/></g><circle cx="32" cy="32" r="6" fill="#b88a44"/></svg><b>LALLA</b></div>
    <h1 id="offTitle"></h1>
    <p id="offBody"></p>
  </div>
</div>

<div class="app" id="app" hidden>
  <aside class="side">
    <div class="s-brand"><svg viewBox="0 0 64 64" aria-hidden="true"><rect width="64" height="64" rx="16" fill="#fbf3ee"/><circle cx="32" cy="32" r="24" fill="#b0516f"/><g fill="#fff6f2"><ellipse cx="32" cy="18" rx="6" ry="11"/><ellipse cx="32" cy="18" rx="6" ry="11" transform="rotate(72 32 32)"/><ellipse cx="32" cy="18" rx="6" ry="11" transform="rotate(144 32 32)"/><ellipse cx="32" cy="18" rx="6" ry="11" transform="rotate(216 32 32)"/><ellipse cx="32" cy="18" rx="6" ry="11" transform="rotate(288 32 32)"/></g><circle cx="32" cy="32" r="6" fill="#b88a44"/></svg><div><b>LALLA</b><small data-a="owner">Owner dashboard</small></div></div>
    <nav class="tabs" id="tabs" aria-label="Dashboard"></nav>
    <div class="s-foot">
      <div id="alang"></div>
      <a href="/demo/beauty" target="_blank" rel="noopener"><span data-a="viewSite">View website</span><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 17 17 7"/><path d="M7 7h10v10"/></svg></a>
      <span class="demo-tag" data-a="demoTag">Demo by MBN DEV</span>
    </div>
  </aside>
  <main class="main">
    <header class="top">
      <div><h1 id="pageTitle"></h1><p id="pageSub"></p></div>
      <div class="top-r"><div class="only-small" id="alang2"></div><span class="live" id="liveState"></span><button class="abtn ghost sm" id="soundBtn"></button></div>
    </header>
    <section id="view"></section>
  </main>
</div>
<div class="amodal" id="amodal" role="dialog" aria-modal="true" hidden></div>
<div class="atoast" id="atoast" role="status" aria-live="polite"></div>
<script type="module" src="/demos/beauty/js/admin.js"></script>
</body>
</html>
