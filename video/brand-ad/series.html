  .ba-k { left: 96px; top: 190px; font-size: 28px; font-weight: 700; letter-spacing: 0.18em; text-transform: uppercase; color: var(--pl); }

<body>
<div id="deck"></div>
<script>
  const D = Object.assign({ series: 'MBN DEV', slides: [] }, window.__DATA || {});
  const n = D.slides.length;
  const lock = '<span class="lock"><img src="assets/brand-icon-transparent.webp" alt="MBN DEV" /><b><span class="a">MBN</span><span class="b">DEV</span></b></span>';
  const dots = (i) => `<span class="dots">${D.slides.map((_, k) => `<i class="${k === i ? 'on' : ''}"></i>`).join('')}</span>`;
  const svg = (d, c = '#fff', w = 40, sw = 2.6) => `<svg width="${w}" height="${w}" viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="${sw}" stroke-linecap="round" stroke-linejoin="round">${d}</svg>`;
  const CHAT = '<path d="M12 3a9 9 0 0 0-7.8 13.5L3 21l4.6-1.2A9 9 0 1 0 12 3z"/>';
  const CHK = '<path d="M5 12.5l4.5 4.5L19 7.5"/>';
  const ARROW = '<path d="M5 12h14M13 6l6 6-6 6"/>';

  // ── ONE DETAIL macros ──
  const MACRO = {
    whatsapp: () => `<div class="abs macro m-wa"><div class="page"><div class="hero"></div>
        <i class="ln" style="left:40px;top:470px;width:420px"></i><i class="ln" style="left:40px;top:510px;width:560px"></i><i class="ln" style="left:40px;top:550px;width:360px"></i></div>
        <div class="tip">Chat with us<small>Usually replies in minutes</small></div>
        <div class="btn">${svg(CHAT, '#fff', 120, 1.8)}</div><div class="bez"></div></div>`,
    headline: () => `<div class="abs macro m-h"><div class="hold">Welcome to our website</div>
        <div class="hnew">Fresh fish, grilled daily. <em>Book a table.</em></div><div class="cta">Book a table</div>
        <div class="tag">${svg(CHK, '#6ee7b7', 26, 3)}5-second test</div></div>`,
    speed: () => `<div class="abs macro m-s"><svg class="ring" viewBox="0 0 400 400"><defs><linearGradient id="rg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#a855f7"/><stop offset=".55" stop-color="#3b82f6"/><stop offset="1" stop-color="#06b6d4"/></linearGradient></defs>
        <circle cx="200" cy="200" r="170" fill="none" stroke="rgba(255,255,255,0.07)" stroke-width="26"/><circle cx="200" cy="200" r="170" fill="none" stroke="url(#rg)" stroke-width="26" stroke-linecap="round" stroke-dasharray="1068" stroke-dashoffset="21" transform="rotate(-90 200 200)" style="filter:drop-shadow(0 0 16px rgba(168,85,247,0.6))"/></svg>
        <div class="ring" style="pointer-events:none"><b>0.8s</b></div><div class="lab">FULLY LOADED · ON MOBILE DATA</div>
        <div class="chips"><span>Images <b>compressed</b></span><span>Code <b>minimal</b></span><span>Hosting <b>fast</b></span></div></div>`,
  };

  // ── Restaurant mockups ──
  const OLD = `<div class="old"><div class="top">~ Welcome to Sardina Restaurant ~</div><div class="mq">*** NEW!!! *** Fresh fish every day *** Call us for reservation *** NEW!!! ***</div>
      <div class="nv">Home | About Us | Menu | Photos | Contact | Guestbook</div>
      <div class="row"><div class="pic">[ restaurant.jpg ]</div><div class="txt">Welcome to our website!!! We are a restaurant in Essaouira since 1998. We serve fish and other food. Our restaurant is very good. Please call us to make a reservation or for more information about our menu and prices.</div></div>
      <div class="pdf">&#128196; Download our MENU (PDF, 14 MB)</div>
      <div class="tel">Tel: 05 24 xx xx xx (from 9h to 12h only) — Fax: 05 24 xx xx xx</div>
      <div class="row" style="margin-top:14px"><div class="pic" style="width:150px;height:110px">[ fish1.jpg ]</div><div class="pic" style="width:150px;height:110px">[ fish2.jpg ]</div><div class="pic" style="width:150px;height:110px">[ fish3.jpg ]</div></div>
      <div class="ctr">You are visitor n° 004821 · Best viewed with Internet Explorer 6 · © 2011</div></div>`;
  const NEW = `<div class="new"><div class="hero"></div><div class="sun"></div>
      <div class="nav"><b>Sardina</b><span><em style="font-style:normal">Menu</em><em style="font-style:normal">Book</em><em style="font-style:normal">Find us</em></span></div>
      <h3>Grilled today, straight from the port.</h3>
      <div class="bts"><span style="background:linear-gradient(135deg,#8b5cf6,#6d28d9);box-shadow:0 0 26px rgba(124,58,237,0.5)">Book a table</span><span style="background:#25d366;color:#052e16">WhatsApp</span></div>
      <div class="menu">
        <div><i style="background:linear-gradient(135deg,#fb923c,#7c2d12)"></i><b>Grilled sardines</b><em>60 MAD</em></div>
        <div><i style="background:linear-gradient(135deg,#0e7490,#1e3a8a)"></i><b>Seafood tagine</b><em>110 MAD</em></div>
        <div><i style="background:linear-gradient(135deg,#a855f7,#1e3a8a)"></i><b>Catch of the day</b><em>Market price</em></div></div>
      <div class="info"><span>&#9679; Open now · until 23:00</span><span>&#9906; Port of Essaouira</span><span>★ 4.8 · 612 reviews</span></div></div>`;
  const win = (inner, top, h, url) => `<div class="abs win" style="top:${top}px;height:${h}px"><div class="bar"><i></i><i></i><i></i><span>${url}</span></div><div class="vp">${inner}</div></div>`;
  const marks = (list, cls, top) => list.map(([x, y], k) => `<span class="mk ${cls}" style="left:${96 + x}px;top:${top + 58 + y}px">${k + 1}</span>`).join('');

  const render = (s, i) => {
    if (s.kind === 'detail') return `${MACRO[s.macro]()}<div class="abs d-no">DETAIL #${s.no}</div><div class="abs d-t">${s.title}</div><div class="abs d-b">${s.body}</div>`;
    if (s.kind === 'bacover') return `<div class="abs ba-k">${s.kicker}</div><div class="abs ba-t">${s.title}</div>
      <div class="abs win" style="top:470px;height:700px"><div class="bar"><i></i><i></i><i></i><span>${s.url}</span></div>
        <div class="vp"><div style="position:absolute;inset:0;clip-path:inset(0 50% 0 0)">${OLD}</div><div style="position:absolute;inset:0;clip-path:inset(0 0 0 50%)">${NEW}</div><i class="sl"></i><span class="slh">${svg('<path d="M9 6l-6 6 6 6M15 6l6 6-6 6"/>', '#6d28d9', 44, 2.6)}</span>
        <span class="badge b" style="left:22px;bottom:22px">BEFORE</span><span class="badge a" style="right:22px;bottom:22px">AFTER</span></div></div>`;
    if (s.kind === 'before') return `${win(OLD, 190, 790, s.url)}<span class="badge b" style="right:120px;top:212px;height:44px;font-size:19px">BEFORE</span>${marks(s.marks, 'b', 190)}
      <div class="abs notes b">${s.notes.map((t, k) => `<div><i>${k + 1}</i>${t}</div>`).join('')}</div>`;
    if (s.kind === 'after') return `${win(NEW, 190, 790, s.url)}<span class="badge a" style="right:120px;top:212px;height:44px;font-size:19px">AFTER</span>${marks(s.marks, 'a', 190)}
      <div class="abs notes a">${s.notes.map((t, k) => `<div><i>${k + 1}</i>${t}</div>`).join('')}</div>`;
    if (s.kind === 'changed') return `<div class="abs ba-k">${s.kicker}</div><div class="abs ba-t">${s.title}</div>
      <div class="abs chg">${s.rows.map(([x, y]) => `<div class="c"><span class="x">${x}</span>${svg(ARROW, '#a855f7', 44, 2.6)}<span class="y">${y}</span></div>`).join('')}</div>`;
    return `<h2 class="abs">${s.title}</h2><p class="abs">${s.body}</p><span class="abs btn">${s.button}</span>`;
  };

  document.getElementById('deck').innerHTML = D.slides.map((s, i) => {
    const count = D.single ? `<span class="count">mbndev.ma</span>` : `<span class="count">${String(i + 1).padStart(2, '0')} / ${String(n).padStart(2, '0')}</span>`;
    return `<section class="slide ${s.kind}"><div class="abs glow"></div>
      <div class="abs head"><span class="series">${s.series || D.series}<i></i></span>${count}</div>
      ${render(s, i)}
      <div class="abs foot">${lock}${D.single ? '' : dots(i)}</div><div class="abs grain"></div><div class="abs vig"></div></section>`;
  }).join('');
  window.__ready = document.fonts.ready.then(() => Promise.all([...document.images].map((im) => im.decode().catch(() => {}))));
</script>
</body>
</html>
